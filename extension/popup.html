<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Browser Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Browser Bridge</h1>
      <div class="connection">
        <span id="lamp" aria-hidden="true"></span>
        <p id="connection" role="status">Connecting</p>
        <button id="refresh" aria-label="Refresh connection" title="Refresh">
          <svg
            aria-hidden="true"
            viewBox="0 0 16 16"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M13 6a5 5 0 1 0 0 4M13 2v4H9" />
          </svg>
        </button>
      </div>
    </header>
    <main>
      <div id="tabs" aria-label="Agent tabs"><p class="empty">Loading</p></div>
      <p id="error" role="alert" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
