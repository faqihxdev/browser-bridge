<svg xmlns="http://www.w3.org/2000/svg" width="880" height="442" viewBox="0 0 880 442" role="img" aria-labelledby="perf-title perf-description">
  <title id="perf-title">Browser Bridge latency before and after optimization</title>
  <desc id="perf-description">Median controller latency in headless Chromium. Click by selector: 10.3 ms before, 1.4 ms after. Fill a text field: 9.3 ms before, 1.2 ms after. Fill, click and read batch: 21.3 ms before, 3.6 ms after. Click in a 6,000-element page: 25.8 ms before, 2.2 ms after. Snapshot, 1,000 elements: 43.3 ms before, 8.5 ms after. Snapshot across 9 frames: 7.1 ms before, 3.1 ms after. Open a tab: 77.1 ms before, 57.6 ms after.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .label { fill: #d9d9d9; font-size: 14px; }
    .value { fill: #868686; font-size: 12px; }
    .now { fill: #e9e9e9; }
    .speedup { fill: #e9e9e9; font-size: 15px; font-weight: 600; text-anchor: end; }
    .before { fill: #4a4a4a; }
    .after { fill: #e8e8e8; }
  </style>
  <rect x=".5" y=".5" width="879" height="441" rx="14" fill="#141414" stroke="#363636"/>
  <text x="24" y="38" fill="#e9e9e9" font-size="17" font-weight="600">Median latency, lower is better</text>
  <rect x="24" y="54" width="12" height="12" rx="3" class="before"/>
  <text x="44" y="64" class="value">Before optimization</text>
  <rect x="180" y="54" width="12" height="12" rx="3" class="after"/>
  <text x="200" y="64" class="value now">Now</text>
  <text x="856" y="64" class="value" text-anchor="end">Speedup</text>
  <text x="24" y="105" class="label">Click by selector</text>
  <rect x="252" y="88" width="64.4" height="12" rx="3" class="before"/>
  <text x="324.4" y="98" class="value">10.3 ms</text>
  <rect x="252" y="104" width="8.8" height="12" rx="3" class="after"/>
  <text x="268.8" y="114" class="value now">1.4 ms</text>
  <text x="856" y="107" class="speedup">7.4×</text>
  <text x="24" y="153" class="label">Fill a text field</text>
  <rect x="252" y="136" width="58.1" height="12" rx="3" class="before"/>
  <text x="318.1" y="146" class="value">9.3 ms</text>
  <rect x="252" y="152" width="7.5" height="12" rx="3" class="after"/>
  <text x="267.5" y="162" class="value now">1.2 ms</text>
  <text x="856" y="155" class="speedup">7.8×</text>
  <text x="24" y="201" class="label">Fill, click and read batch</text>
  <rect x="252" y="184" width="133.1" height="12" rx="3" class="before"/>
  <text x="393.1" y="194" class="value">21.3 ms</text>
  <rect x="252" y="200" width="22.5" height="12" rx="3" class="after"/>
  <text x="282.5" y="210" class="value now">3.6 ms</text>
  <text x="856" y="203" class="speedup">5.9×</text>
  <text x="24" y="249" class="label">Click in a 6,000-element page</text>
  <rect x="252" y="232" width="161.3" height="12" rx="3" class="before"/>
  <text x="421.3" y="242" class="value">25.8 ms</text>
  <rect x="252" y="248" width="13.8" height="12" rx="3" class="after"/>
  <text x="273.8" y="258" class="value now">2.2 ms</text>
  <text x="856" y="251" class="speedup">11.7×</text>
  <text x="24" y="297" class="label">Snapshot, 1,000 elements</text>
  <rect x="252" y="280" width="270.6" height="12" rx="3" class="before"/>
  <text x="530.6" y="290" class="value">43.3 ms</text>
  <rect x="252" y="296" width="53.1" height="12" rx="3" class="after"/>
  <text x="313.1" y="306" class="value now">8.5 ms</text>
  <text x="856" y="299" class="speedup">5.1×</text>
  <text x="24" y="345" class="label">Snapshot across 9 frames</text>
  <rect x="252" y="328" width="44.4" height="12" rx="3" class="before"/>
  <text x="304.4" y="338" class="value">7.1 ms</text>
  <rect x="252" y="344" width="19.4" height="12" rx="3" class="after"/>
  <text x="279.4" y="354" class="value now">3.1 ms</text>
  <text x="856" y="347" class="speedup">2.3×</text>
  <text x="24" y="393" class="label">Open a tab</text>
  <rect x="252" y="376" width="481.9" height="12" rx="3" class="before"/>
  <text x="741.9" y="386" class="value">77.1 ms</text>
  <rect x="252" y="392" width="360.0" height="12" rx="3" class="after"/>
  <text x="620.0" y="402" class="value now">57.6 ms</text>
  <text x="856" y="395" class="speedup">1.3×</text>
</svg>
