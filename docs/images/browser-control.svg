<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="demo-title demo-description">
  <title id="demo-title">Browser Bridge in action</title>
  <desc id="demo-description">An illustrated browser runs a JavaScript loop. A white cursor curves into the editor tip first, types the code, sweeps over to Run, overshoots slightly, settles and clicks it. The output shows one through five while the cursor drifts slightly at rest. When control ends, the cursor and favicon overlay disappear.</desc>
