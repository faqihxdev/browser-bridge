<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="demo-title demo-description">
  <title id="demo-title">Browser Bridge in action</title>
  <desc id="demo-description">An illustrated browser runs a JavaScript loop. A white cursor moves from the editor to Run, the output shows one through five, and the cursor and favicon overlay disappear when control ends.</desc>
  <defs>
    <path id="cursor" d="M4.1 2.8 21 9.7Q22.4 10.3 20.9 10.9L14.1 13.6Q13.7 13.7 13.6 14.1L10.9 20.9Q10.3 22.4 9.7 21L2.8 4.1Q2 2 4.1 2.8Z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono text, text.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .muted { fill: #868686; }
      .ink { fill: #e9e9e9; }
      .code { animation: code 9s infinite; }
      .output { animation: output 9s infinite; }
      .pointer { transform: translate(947px, 139px) scale(1.35); animation: pointer 9s infinite; }
      .favicon { opacity: .55; animation: favicon 9s infinite; }
      .ownership { animation: ownership 9s infinite; }
      .released { opacity: 0; animation: released 9s infinite; }
      .click { opacity: 0; transform-origin: 960px 150px; animation: click 9s infinite; }
      @keyframes code { 0%, 19% { opacity: 0; } 20%, 100% { opacity: 1; } }
      @keyframes output { 0%, 59% { opacity: 0; } 60%, 100% { opacity: 1; } }
      @keyframes pointer {
        0%, 9% { transform: translate(315px, 264px) scale(1.35); opacity: 1; }
        20%, 38% { transform: translate(474px, 297px) scale(1.35); opacity: 1; animation-timing-function: cubic-bezier(.22, 1, .36, 1); }
        47%, 83% { transform: translate(947px, 139px) scale(1.35); opacity: 1; }
        88%, 100% { transform: translate(947px, 139px) scale(1.35); opacity: 0; }
      }
      @keyframes favicon { 0%, 83% { opacity: .55; } 88%, 100% { opacity: 1; } }
      @keyframes ownership { 0%, 83% { opacity: 1; } 88%, 100% { opacity: 0; } }
      @keyframes released { 0%, 83% { opacity: 0; } 88%, 100% { opacity: 1; } }
      @keyframes click { 0%, 49% { opacity: 0; transform: scale(.5); } 50% { opacity: .6; transform: scale(.5); } 58%, 100% { opacity: 0; transform: scale(1.7); } }
      @media (prefers-reduced-motion: reduce) {
        .code, .output, .pointer, .favicon, .ownership, .released, .click { animation: none; }
      }
    </style>
  </defs>
  <rect x=".5" y=".5" width="1079" height="559" rx="18" fill="#111" stroke="#363636"/>
  <path d="M18 1H1062Q1079 1 1079 18V100H1V18Q1 1 18 1Z" fill="#191919"/>
  <path d="M16 48V21Q16 11 26 11H262Q272 11 272 21V48" fill="#292929"/>
  <g class="favicon" stroke="#d9d9d9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="m39 24-5 5 5 5m10-10 5 5-5 5m-5-13-3 17"/>
  </g>
  <use href="#cursor" x="43" y="26" width="16" height="16" transform="translate(14 9) scale(.7)" class="ownership"/>
  <text x="67" y="34" font-size="14" class="ink">JavaScript playground</text>
  <path d="m247 25 7 7m0-7-7 7" stroke="#929292" stroke-width="1.3" stroke-linecap="round"/>
  <g class="muted" font-size="14">
    <text x="308" y="33">Documentation</text>
    <text x="469" y="33" font-size="20">+</text>
  </g>
  <path d="M32 73H47m-15 0 6-6m-6 6 6 6m33-6H86m0 0-6-6m6 6-6 6M113 69a7 7 0 1 0 1 9m-1-9v6h-6" fill="none" stroke="#929292" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="146" y="57" width="834" height="32" rx="8" fill="#101010" stroke="#323232"/>
  <path d="M164 71v-3a4 4 0 0 1 8 0v3m-9 0h10v8h-10Z" fill="none" stroke="#888" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="187" y="78" font-size="13" fill="#b9b9b9">playground.example</text>
  <use href="#cursor" transform="translate(1001 62)"/>
  <circle cx="1048" cy="73" r="2" fill="#aaa"/>
  <circle cx="1048" cy="66" r="2" fill="#aaa"/>
  <circle cx="1048" cy="80" r="2" fill="#aaa"/>
  <path d="M1 100H1079" stroke="#333"/>
  <text x="32" y="151" class="ink" font-size="22" font-weight="600">JavaScript</text>
  <rect x="903" y="120" width="145" height="42" rx="8" fill="#e8e8e8"/>
  <path d="m928 133 12 8-12 8Z" fill="#111"/>
  <text x="952" y="147" font-size="15" font-weight="600" fill="#111">Run</text>
  <rect x="32" y="186" width="630" height="305" rx="10" fill="#161616" stroke="#343434"/>
  <rect x="684" y="186" width="364" height="305" rx="10" fill="#0d0d0d" stroke="#343434"/>
  <path d="M32 231H662m22 0h364" stroke="#303030"/>
  <text x="53" y="214" font-size="13" fill="#b7b7b7" class="mono">main.js</text>
  <text x="705" y="214" font-size="13" fill="#b7b7b7">Output</text>
  <g class="mono" font-size="18" fill="#575757" text-anchor="end">
    <text x="66" y="275">1</text>
    <text x="66" y="309">2</text>
    <text x="66" y="343">3</text>
  </g>
  <g class="mono code" font-size="19">
    <text x="88" y="275" fill="#c7c7c7"><tspan fill="#fff">for</tspan> (let i = 1; i &lt;= 5; i++) {</text>
    <text x="110" y="309" fill="#c7c7c7">console.log(i);</text>
    <text x="88" y="343" fill="#c7c7c7">}</text>
  </g>
  <g class="output mono ink" font-size="19">
    <text x="708" y="275">1</text>
    <text x="708" y="309">2</text>
    <text x="708" y="343">3</text>
    <text x="708" y="377">4</text>
    <text x="708" y="411">5</text>
  </g>
  <g font-size="13" class="muted">
    <text x="32" y="530">Browser Bridge</text>
    <g class="ownership">
      <circle cx="168" cy="526" r="3" fill="#ddd"/>
      <text x="181" y="530">Controlling this tab</text>
    </g>
    <text x="163" y="530" class="released">Tab released</text>
    <text x="1048" y="530" text-anchor="end" fill="#666">Interaction mockup</text>
  </g>
  <circle cx="960" cy="150" r="18" fill="none" stroke="#fff" stroke-width="1.3" class="click"/>
  <use href="#cursor" class="pointer"/>
</svg>
