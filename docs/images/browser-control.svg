      .type-2 { animation: type-2 10s infinite steps(15, end); }
      .type-3 { animation: type-3 10s infinite steps(1, end); }
      .caret-1 { animation: caret-1 10s infinite; }
      .caret-2 { animation: caret-2 10s infinite; }
      .caret-3 { animation: caret-3 10s infinite; }
      .output text { opacity: 0; animation: output 10s infinite; }
