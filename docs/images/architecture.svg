<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="bb-title bb-description">
  <title id="bb-title">Browser Bridge architecture</title>
  <desc id="bb-description">MCP agents select browsers by name or stable ID through stdio adapters. One shared local manager maintains independent Playwright controllers and CDP connections for each browser. Browser-qualified tab IDs preserve routing. Native Messaging hosts reach extensions whose live connection identities are verified in the selected browser. A persistent Windows UI Automation helper handles native controls.</desc>
  <defs>
    <marker id="bb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#aaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .node { fill: #171717; stroke: #3b3b3b; stroke-width: 1.5; }
      .accent { fill: #202020; stroke: #626262; stroke-width: 1.5; }
      .name { fill: #ededed; font-size: 21px; font-weight: 600; }
      .detail { fill: #c0c0c0; font-size: 16px; }
      .caption { fill: #9b9b9b; font-size: 14px; }
      .edge { fill: none; stroke: #aaa; stroke-width: 2; marker-end: url(#bb-arrow); stroke-linejoin: round; }
      .both { marker-start: url(#bb-arrow); }
    </style>
  </defs>
  <rect width="1280" height="640" rx="16" fill="#0c0c0c"/>
  <text x="40" y="42" fill="#ededed" font-size="18" font-weight="600">Browser Bridge architecture</text>

  <path class="edge both" d="M 220 310 H 270"/>
  <path class="edge both" d="M 480 310 H 540"/>
  <path class="edge both" d="M 800 275 H 880 V 155 H 960"/>
  <path class="edge both" d="M 1100 210 V 295"/>
  <path class="edge both" d="M 670 380 V 490"/>
  <path class="edge both" d="M 800 545 H 960"/>
  <path class="edge both" d="M 1100 405 V 490"/>
  <path class="edge both" d="M 540 350 H 510 V 545 H 480"/>
  <text class="caption" x="808" y="255">Browser ID</text>
  <text class="caption" x="1080" y="257" text-anchor="end">CDP</text>
  <text class="caption" x="688" y="437">Authenticated pipe</text>
  <text class="caption" x="816" y="527">Native Messaging</text>
  <text class="caption" x="1080" y="452" text-anchor="end">Browser APIs</text>

  <rect class="node" x="40" y="255" width="180" height="110" rx="10"/>
  <text class="name" x="60" y="289">MCP agents</text>
  <text class="detail" x="60" y="318">Select by name or ID</text>
  <text class="caption" x="60" y="346">Independent selections</text>

  <rect class="node" x="270" y="255" width="210" height="110" rx="10"/>
  <text class="name" x="290" y="289">Stdio adapters</text>
  <text class="detail" x="290" y="318">One per agent session</text>
  <text class="caption" x="290" y="346">Authenticated local pipe</text>

  <rect class="accent" x="540" y="240" width="260" height="140" rx="10"/>
  <text class="name" x="560" y="277">Shared manager</text>
  <text class="detail" x="560" y="309">Node.js · local discovery</text>
  <text class="caption" x="560" y="337">Browser-qualified tab IDs</text>
  <text class="caption" x="560" y="361">On demand · idle exit</text>

  <rect class="node" x="960" y="100" width="280" height="110" rx="10"/>
  <text class="name" x="980" y="134">Browser controllers</text>
  <text class="detail" x="980" y="163">Playwright · one per browser</text>
  <text class="caption" x="980" y="191">Per-tab queues · ownership</text>

  <rect class="node" x="960" y="295" width="280" height="110" rx="10"/>
  <text class="name" x="980" y="329">Existing browsers</text>
  <text class="detail" x="980" y="358">Signed-in Chromium sessions</text>
  <text class="caption" x="980" y="386">Cursor · temporary favicon</text>

  <rect class="accent" x="960" y="490" width="280" height="110" rx="10"/>
  <text class="name" x="980" y="524">Extensions</text>
  <text class="detail" x="980" y="553">Verified connection identities</text>
  <text class="caption" x="980" y="581">Browser APIs · status · stop</text>

  <rect class="node" x="540" y="490" width="260" height="110" rx="10"/>
  <text class="name" x="560" y="524">Native hosts</text>
  <text class="detail" x="560" y="553">One per extension</text>
  <text class="caption" x="560" y="581">Browser-launched processes</text>

  <rect class="node" x="270" y="490" width="210" height="110" rx="10"/>
  <text class="name" x="290" y="524">Windows UIA</text>
  <text class="detail" x="290" y="553">Native controls</text>
  <text class="caption" x="290" y="581">Inspection · input</text>
</svg>
